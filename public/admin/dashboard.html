<!doctype html>
<html lang="id" data-skin="clean">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Photobooth</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body data-page="dashboard">
    <main id="content">
      <header class="page-head">
        <h1>Dashboard</h1>
        <a class="btn btn-primary" href="/admin/template-edit.html">+ Template baru</a>
      </header>

      <p id="status" class="status-msg" role="status"></p>

      <section class="stats" aria-label="Statistik">
        <div class="card stat">
          <div class="value" id="stat-today">–</div>
          <div class="label">Sesi hari ini</div>
        </div>
        <div class="card stat">
          <div class="value" id="stat-active">–</div>
          <div class="label">Template aktif</div>
        </div>
        <div class="card stat">
          <div class="value" id="stat-inactive">–</div>
          <div class="label">Nonaktif · <span id="stat-archived">–</span> arsip</div>
        </div>
        <div class="card stat">
          <div class="label">Terpopuler</div>
          <ol id="stat-top"></ol>
          <p id="stat-top-empty" class="label">Belum ada sesi</p>
        </div>
      </section>

      <section class="card section">
        <h2>Template</h2>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Gambar</th>
                <th>Nama</th>
                <th>Ukuran</th>
                <th>Slot</th>
                <th>Status</th>
                <th>Dipakai</th>
                <th>Aksi</th>
              </tr>
            </thead>
            <tbody id="templates"></tbody>
          </table>
        </div>
        <p id="templates-empty" class="status-msg" hidden>Belum ada template. Buat template baru untuk memulai.</p>
      </section>

      <section class="card section">
        <h2>Pengaturan</h2>
        <form id="settings-form" class="settings-form">
          <div class="field">
            <label for="countdown_seconds">Hitung mundur (detik)</label>
            <input id="countdown_seconds" class="input" name="countdown_seconds" type="number" min="1" max="10" step="1" required />
          </div>
          <label class="check">
            <input name="mirror_output" type="checkbox" class="switch" role="switch" />
            Cerminkan hasil foto kamera depan
          </label>
          <button type="submit" class="btn btn-primary">Simpan pengaturan</button>
        </form>
        <p id="settings-status" class="status-msg" role="status"></p>
      </section>
    </main>
  </body>
</html>
