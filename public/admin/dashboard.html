<!doctype html>
<html lang="id" data-skin="clean">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Photobooth</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body data-page="dashboard">
    <main id="content">
      <header class="page-head">
        <h1>Dashboard</h1>
        <a class="btn btn-primary" href="/admin/template-edit.html">+ Template baru</a>
      </header>

      <p id="status" class="status-msg" role="status"></p>

      <section class="stats" aria-label="Statistik">
        <div class="card stat">
          <div class="value" id="stat-today">–</div>
          <div class="label">Sesi hari ini</div>
        </div>
        <div class="card stat">
          <div class="value" id="stat-7d">–</div>
          <div class="label">Sesi 7 hari</div>
        </div>
        <div class="card stat">
          <div class="value" id="stat-active">–</div>
          <div class="label">Template aktif</div>
        </div>
        <div class="card stat">
          <div class="value value-text" id="stat-top-name">–</div>
          <div class="label">Terpopuler</div>
        </div>
      </section>

      <div class="dash-grid">
        <section class="card section">
          <h2>Sesi 14 hari terakhir</h2>
          <div id="chart" class="chart-wrap"></div>
        </section>

        <section class="card section">
          <h2>5 terpopuler</h2>
          <ol id="top-list" class="top-list"></ol>
          <p id="top-empty" class="status-msg" hidden>Belum ada sesi</p>
        </section>
      </div>
    </main>
  </body>
</html>
