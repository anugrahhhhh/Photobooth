<!doctype html>
<html lang="id" data-skin="clean">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Pengaturan — Photobooth</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body data-page="settings">
    <main id="content">
      <header class="page-head"><h1>Pengaturan</h1></header>

      <form id="settings-form" class="settings-form-wrap" novalidate>
        <section class="card section">
          <h2>Booth</h2>
          <div class="settings-form">
            <div class="field">
              <label for="countdown_seconds">Hitung mundur (detik)</label>
              <input id="countdown_seconds" class="input" name="countdown_seconds" type="number" min="1" max="10" step="1" required />
            </div>
            <label class="check">
              <input name="mirror_default" type="checkbox" class="switch" role="switch" />
              Cermin default (kamera depan)
            </label>
            <div class="field">
              <label for="review_seconds">Waktu tinjau (detik)</label>
              <input id="review_seconds" class="input" name="review_seconds" type="number" min="0" max="10" step="1" required />
              <span class="hint">0 = tanpa tinjau</span>
            </div>
          </div>
        </section>

        <section class="card section">
          <h2>Hasil &amp; Kirim</h2>
          <div class="settings-form">
            <label class="check">
              <input name="contact_before" type="checkbox" class="switch" role="switch" />
              Minta kontak sebelum foto
            </label>
            <label class="check">
              <input name="video_enabled" type="checkbox" class="switch" role="switch" />
              Aktifkan video
            </label>
          </div>
        </section>

        <section class="card section">
          <h2>Kiosk</h2>
          <div class="settings-form">
            <div class="field">
              <label for="kiosk_idle_seconds">Batas menganggur (detik)</label>
              <input id="kiosk_idle_seconds" class="input" name="kiosk_idle_seconds" type="number" min="30" max="600" step="1" required />
              <span class="hint">Booth kembali ke layar awal setelah tidak disentuh selama ini (30–600).</span>
            </div>
            <label class="check">
              <input name="sound_default" type="checkbox" class="switch" role="switch" />
              Suara aktif secara default
            </label>
          </div>
        </section>

        <div class="settings-actions">
          <button type="submit" class="btn btn-primary">Simpan pengaturan</button>
          <p id="settings-status" class="status-msg" role="status"></p>
        </div>
      </form>

      <section class="card section" id="results-card">
        <h2>Layanan &amp; penyimpanan</h2>
        <div class="settings-form">
          <dl class="service-list">
            <div><dt>Email</dt><dd id="svc-email">Memuat…</dd></div>
            <div><dt>WhatsApp</dt><dd id="svc-whatsapp">Memuat…</dd></div>
          </dl>
          <form id="test-email-form" class="field" novalidate>
            <label for="test-email">Kirim email uji</label>
            <div class="pin-row">
              <input id="test-email" class="input" name="to" type="email" autocomplete="email" placeholder="nama@contoh.com" />
              <button type="submit" id="test-email-send" class="btn btn-primary">Kirim uji</button>
            </div>
          </form>
          <p id="test-email-status" class="status-msg" role="status"></p>
          <div class="field">
            <label>Penyimpanan hasil</label>
            <p id="storage-line" class="storage-line">Memuat…</p>
            <span class="hint">Hasil tamu dihapus otomatis setelah 7 hari.</span>
          </div>
          <div>
            <button type="button" id="results-delete" class="btn btn-danger" disabled>Hapus semua hasil</button>
          </div>
          <p id="results-status" class="status-msg" role="status"></p>
        </div>
      </section>

      <section class="card section">
        <h2>PIN kiosk</h2>
        <div class="settings-form">
          <p id="pin-state" class="status-msg" role="status">Memuat…</p>
          <form id="pin-form" class="field" novalidate>
            <label for="pin">PIN baru (4–8 angka)</label>
            <div class="pin-row">
              <input id="pin" class="input" name="pin" type="password" inputmode="numeric" pattern="\d{4,8}" maxlength="8" autocomplete="new-password" />
              <button type="submit" class="btn btn-primary">Simpan PIN</button>
              <button type="button" id="pin-delete" class="btn" disabled>Hapus PIN</button>
            </div>
          </form>
          <p id="pin-status" class="status-msg" role="status"></p>
        </div>
      </section>
    </main>
  </body>
</html>
