<!doctype html>
<html lang="id" data-skin="clean">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Editor Template — Photobooth</title>
    <script src="/js/theme-boot.js"></script>
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/components.css" />
    <link rel="stylesheet" href="/css/admin.css" />
    <script type="module" src="/admin/admin.js"></script>
  </head>
  <body data-page="edit">
    <main id="content">
      <header class="page-head">
        <h1 id="title">Template baru</h1>
        <a class="btn" href="/admin/templates.html">← Template</a>
      </header>

      <div class="editor">
        <form id="editor" class="card editor-form" novalidate>
          <div class="field">
            <label for="image">File PNG template (bagian slot harus transparan)</label>
            <input id="image" class="input" name="image" type="file" accept="image/png" />
          </div>
          <div class="row">
            <div class="field">
              <label for="canvas_w">Lebar kanvas (px)</label>
              <input id="canvas_w" class="input" name="canvas_w" readonly tabindex="-1" />
            </div>
            <div class="field">
              <label for="canvas_h">Tinggi kanvas (px)</label>
              <input id="canvas_h" class="input" name="canvas_h" readonly tabindex="-1" />
            </div>
          </div>
          <div class="row">
            <div class="field">
              <label for="name">Nama</label>
              <input id="name" class="input" name="name" maxlength="100" required />
            </div>
            <div class="field">
              <label for="bg_color">Warna latar</label>
              <input id="bg_color" class="input color" name="bg_color" type="color" value="#ffffff" />
            </div>
          </div>

          <fieldset class="slots">
            <legend>Slot foto (urutan = urutan pengambilan, maksimal 8)</legend>
            <div class="slot-row slot-head" aria-hidden="true">
              <span>#</span><span>x</span><span>y</span><span>w</span><span>h</span><span></span>
            </div>
            <div id="slot-list"></div>
            <div class="row">
              <button type="button" id="add-slot" class="btn btn-sm">+ Tambah slot</button>
              <button type="button" id="detect-slots" class="btn btn-sm">Deteksi slot otomatis</button>
            </div>
            <p id="detect-status" class="status-msg" role="status"></p>
          </fieldset>

          <ul id="messages" class="messages" aria-live="polite"></ul>

          <div class="row">
            <button type="submit" id="save" class="btn btn-primary" disabled>Simpan</button>
            <button type="button" id="activate" class="btn" disabled>Aktifkan</button>
          </div>
          <p id="status" class="status-msg" role="status"></p>
        </form>

        <section class="card preview-wrap" aria-label="Pratinjau">
          <h2>Pratinjau</h2>
          <canvas id="preview" width="0" height="0"></canvas>
          <p class="status-msg">Kotak berwarna bernomor menandai isi slot. Merah = error, kuning = tumpang tindih.</p>
        </section>
      </div>
    </main>
  </body>
</html>
