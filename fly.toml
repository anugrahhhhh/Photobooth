# fly.toml app configuration file generated for photobooth-anugrah on 2026-10-21T23:09:42Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'photobooth-anugrah'
primary_region = 'sin'

[build]

[env]
  DB_PATH = '/data/photobooth.db'
  NODE_ENV = 'production'
  PORT = '8080'
  TZ = 'Asia/Jakarta'
  UPLOAD_DIR = '/data/uploads'

[[mounts]]
  source = 'photobooth_data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
